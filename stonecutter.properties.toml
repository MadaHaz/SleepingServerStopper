# See https://stonecutter.kikugie.dev/wiki/config/properties#centralized-properties
# Keys in [loader."mc"] / ["mc"] tables apply only to that node.
#   mod.mc_compat      - Minecraft range written into fabric.mod.json / mods.toml
#   mod.mc_label       - the same range for humans; goes into the jar name
#   mod.smoke_versions - Minecraft versions the smoke test runs this jar on (both ends of the range,
#                        and at least one version per minor release in between). `<mc>@<loader>` runs
#                        it on another loader's server, e.g. `1.20.1@neoforge` for the Forge fork.
# Each node is built against the LOWEST version of its range.
mod.id = "sleepingserverstoppermod"
mod.name = "Sleeping Server Stopper"
mod.group = "net.madahaz"
mod.version = "4.1.0"
mod.authors = "MadaHaz"
mod.description = "Shuts the server down after it has been empty for a while. Port of the Sleeping Server Stopper Spigot plugin, meant for use with SleepingServerStarter."

deps.fabric_loader = "0.20.0"


# ---------------- Fabric ----------------
# Before 26.1 Fabric runs on intermediary names, which are stable across versions.
[fabric."1.16.5"]
mod.mc_compat = ">=1.16.4 <26"
mod.mc_label = "1.16.4-1.21.11"
mod.smoke_versions = "1.16.5 1.17.1 1.18.2 1.19.4 1.20.1 1.20.4 1.20.6 1.21.1 1.21.4 1.21.11"
deps.fabric_api = "0.42.0+1.16"

# 26.1+ is unobfuscated, so it needs its own jar.
[fabric."26.1"]
mod.mc_compat = ">=26.1 <27"
mod.mc_label = "26.x"
mod.smoke_versions = "26.1 26.3"
deps.fabric_api = "0.145.1+26.1"


# ---------------- Forge (ModDevGradle legacyforge) ----------------
# Forge 1.18 - 1.20.1 runs on SRG names, which are stable across these versions.
# Forge 1.20.2+ renumbered SRG names: 1.20.2 - 1.20.4 is legacy/forge-1.20.4, 1.20.6+ is legacy/forge-1.21.1
# and legacy/forge-1.21.6. Forge 1.16.5 and older are under legacy/ too.
[forge."1.17.1"]
mod.mc_compat = "[1.17.1]"
mod.mc_label = "1.17.1"
mod.smoke_versions = "1.17.1"
mod.loader_compat = "[37,)"
deps.forge = "1.17.1-37.1.1"

[forge."1.18.2"]
mod.mc_compat = "[1.18.2,1.20.1]"
mod.mc_label = "1.18.2-1.20.1"
mod.smoke_versions = "1.18.2 1.19.2 1.19.4 1.20.1 1.20.1@neoforge"
mod.loader_compat = "[40,)"
deps.forge = "1.18.2-40.3.12"


# ---------------- NeoForge ----------------
# NeoForge 1.20.5+ runs on Mojang names and reads neoforge.mods.toml.
# NeoForge 1.20.2 - 1.20.4 is legacy/neoforge-1.20.4. On 1.20.1 NeoForge is a Forge fork: use the Forge jar.
[neoforge."1.21.1"]
mod.mc_compat = "[1.20.6,27)"
mod.mc_label = "1.20.6-26.x"
mod.smoke_versions = "1.20.6 1.21.1 1.21.4 1.21.11 26.1.2 26.3"
deps.neoforge = "21.1.264"
