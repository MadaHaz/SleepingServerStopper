name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  modern:
    name: Fabric / NeoForge / Forge 1.18+
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core
        run: ./gradlew :core:test
      - name: Build all versions
        run: ./gradlew buildAll
      - uses: actions/upload-artifact@v4
        with:
          name: modern
          path: build/libs/*/*.jar

  legacy:
    name: Forge ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.16.5", "1.12.2", "1.7.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew -p legacy/forge-${{ matrix.mc }} build
      - uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.mc }}
          path: |
            legacy/forge-${{ matrix.mc }}/build/libs/*.jar
            !legacy/forge-${{ matrix.mc }}/build/libs/*-dev.jar
            !legacy/forge-${{ matrix.mc }}/build/libs/*-sources.jar
