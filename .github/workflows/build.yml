name: Build

on:
  push:
    branches: [dev, master]
  pull_request:
  workflow_dispatch:

jobs:
  modern:
    name: Fabric / NeoForge 1.20.6+ / Forge 1.17.1 - 1.20.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core
        run: ./gradlew :core:test
      - name: Build all versions
        run: ./gradlew buildAll
      - uses: actions/upload-artifact@v4
        with:
          name: modern
          path: build/libs/*/*.jar

  legacy:
    name: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ["forge-1.21.6", "forge-1.21.1", "forge-1.20.4", "neoforge-1.20.4", "forge-1.16.5", "forge-1.12.2", "forge-1.7.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew -p legacy/${{ matrix.dir }} build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}
          path: |
            legacy/${{ matrix.dir }}/build/libs/*.jar
            !legacy/${{ matrix.dir }}/build/libs/*-dev.jar
            !legacy/${{ matrix.dir }}/build/libs/*-sources.jar

  # The smoke test only runs when the workflow is started by hand (Actions tab > Build > Run workflow).
  # Pushes and pull requests stop after the builds above.
  # One job per Minecraft version + loader, generated from the same list the local smoke test uses.
  smoke-targets:
    name: List smoke test targets
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "matrix=$(node test/smoke/run.mjs --list-json)" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke ${{ matrix.target }}
    needs: [modern, legacy, smoke-targets]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.smoke-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/smoke/package-lock.json
      - run: npm ci
        working-directory: test/smoke
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
      - name: Boot a real server and check the mod shuts it down
        run: node test/smoke/run.mjs --only ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-log-${{ matrix.target }}
          path: test/smoke/.work/logs/
