<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="902" viewBox="0 0 1240 902" role="img" aria-labelledby="title desc">
  <title id="title">Sleeping Server Stopper 4.1.0 version coverage</title>
  <desc id="desc">Which jar covers each Minecraft version on Fabric, NeoForge and Forge. Each bar is one jar (sss- is short for sleepingserverstoppermod-). NeoForge 1.20.1 uses the Forge 1.18.2 to 1.20.1 jar. Columns are evenly spaced in version order.</desc>
  <defs>
    <style>
      svg {
        --bg: #ffffff; --line: #e3e7e5; --zebra: #f4f7f5; --grid: #d5dbd8;
        --ink: #111111; --muted: #5d6662; --accent-ink: #0a8456; --mint: #12c985;
        --pill: #e7f8f0;
      }
      @media (prefers-color-scheme: dark) {
        svg {
          --bg: #111312; --line: #262b29; --zebra: #171a19; --grid: #2c3230;
          --ink: #eef1f0; --muted: #96a09c; --accent-ink: #3ddc9e; --mint: #12c985;
          --pill: #10291f;
        }
      }
      text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; fill: var(--ink); }
      .card { fill: var(--bg); stroke: var(--line); }
      .eyebrow { fill: var(--accent-ink); font-size: 12px; font-weight: 700; letter-spacing: 2.5px; }
      .title { font-size: 28px; font-weight: 700; }
      .small { font-size: 12px; }
      .muted { fill: var(--muted); }
      .axis { fill: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 1.6px; }
      .tick { fill: var(--muted); font-size: 11px; }
      .loader { font-size: 15px; font-weight: 700; }
      .file { font-size: 13px; }
      .note { fill: var(--accent-ink); font-weight: 700; }
      .rule { stroke: var(--line); stroke-width: 1; }
      .grid { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 2 5; }
      .zebra { fill: var(--zebra); }
      .bar { fill: url(#stripes); stroke: var(--mint); stroke-width: 1.5; }
      .marker { fill: var(--mint); stroke: var(--bg); stroke-width: 2; stroke-linejoin: round; }
      .halo { fill: var(--mint); opacity: .2; }
      .outline { stroke: var(--ink); }
      .outline-accent { stroke: var(--mint); }
      .pill { fill: var(--pill); stroke: var(--mint); stroke-opacity: .6; }
      .pill-text { fill: var(--accent-ink); font-size: 14px; font-weight: 700; }
      .stripe { fill: var(--mint); }
    </style>
    <pattern id="stripes" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="3" height="6" class="stripe"/>
    </pattern>
    <pattern id="stripes-logo" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="3" height="5" class="stripe"/>
    </pattern>
  </defs>

